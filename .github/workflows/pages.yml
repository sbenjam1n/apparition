name: Deploy to GitHub Pages

# The prototype is already a static site — index.html plus ES modules, no build
# step — so this uploads the repository as-is. All internal paths are relative,
# so it works unchanged from a project subpath like /apparition/.

on:
  push:
    branches:
      - main
      - claude/project-understanding-n1xp45
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a run finish rather than cancelling it, so a queued deploy is never lost.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - id: deployment
        uses: actions/deploy-pages@v4
