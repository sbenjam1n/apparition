name: Deploy to GitHub Pages

# OPTIONAL. The recommended way to publish this repo is branch-based Pages —
# Settings > Pages > Source: "Deploy from a branch", branch `main`, folder
# `/ (root)`. That uses GitHub's own Pages builder and needs no Actions run at
# all, which matters because the site is already static: index.html plus ES
# modules, no build step, and `.nojekyll` at the root so files are served
# verbatim. Every internal path is relative, so it works from the /apparition/
# project subpath unchanged.
#
# This workflow is the Actions-based alternative, kept for when Pages is set to
# "GitHub Actions" as its source. It is deliberately manual-only: an
# Actions-source deploy that cannot get a runner queues forever, and firing it on
# every push just piles up stuck runs. Run it from the Actions tab when you want
# it.

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - id: deployment
        uses: actions/deploy-pages@v4
